name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.15", "3.12.15"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and test tools
        run: python -m pip install -r requirements/build.txt -r requirements/dev.txt
      - name: Core tests and lint
        run: |
          python -m pytest
          python -m ruff check .
          python -m ruff format --check .
      - name: Build and inspect wheel and source archive
        run: |
          python -c 'from setuptools.build_meta import build_sdist, build_wheel; build_sdist("dist"); build_wheel("dist")'
          python -I tools/release_check.py dist/checkpoint_contract-0.1.0-py3-none-any.whl dist/checkpoint_contract-0.1.0.tar.gz
      - name: Install wheel and exercise core without optional frameworks
        env:
          CHECKPOINT_CONTRACT_INSTALLED: "1"
          CHECKPOINT_CONTRACT_CORE_ONLY: "1"
          CHECKPOINT_RELEASE_INSTALLED: "1"
        run: |
          python -m pip install --no-deps dist/checkpoint_contract-0.1.0-py3-none-any.whl
          python -I examples/custom_session.py
          python -m unittest discover -s tests -p test_installed.py
          (
            contract_tmp=$(mktemp -d)
            trap 'rm -rf "$contract_tmp"' EXIT
            cd "$contract_tmp"
            python -I "$GITHUB_WORKSPACE/tests/test_public_contracts.py"
          )
      - name: Install source archive and repeat installed checks
        env:
          CHECKPOINT_CONTRACT_INSTALLED: "1"
          CHECKPOINT_CONTRACT_CORE_ONLY: "1"
          CHECKPOINT_RELEASE_INSTALLED: "1"
        run: |
          python -m pip install --force-reinstall --no-deps --no-build-isolation dist/checkpoint_contract-0.1.0.tar.gz
          python -I examples/custom_session.py
          python -m unittest discover -s tests -p test_installed.py
          (
            contract_tmp=$(mktemp -d)
            trap 'rm -rf "$contract_tmp"' EXIT
            cd "$contract_tmp"
            python -I "$GITHUB_WORKSPACE/tests/test_public_contracts.py"
          )

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
      - name: Install official CPU torch and reference dependencies
        run: |
          python -m pip install -r requirements/build.txt
          python -m pip install -c requirements/constraints.txt torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/integration.txt
          python -m pip install --no-deps --no-build-isolation .
      - name: Check known HF regression and TorchData resume, including replay
        run: python -I tools/integration_smoke.py
